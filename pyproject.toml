[project]
name = "visual-memory-lab"
version = "0.6.0"
description = "A research lab for task-relevant visual memory in real office scenes."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.141.1",
    "matplotlib>=3.11.1",
    "numpy>=2.5.2",
    "openai>=2,<3",
    "av>=14,<17",
    "pillow>=12.3.0,<13",
    "plyfile>=1.1.5",
    "pydantic>=2,<3",
    "python-dotenv>=1,<2",
    "python-multipart>=0.0.32",
    "rosbags>=0.11.3",
    "scipy>=1.18.0",
    "torch>=2.7,<3",
    "torchvision>=0.28,<0.29",
    "transformers>=5.9,<6",
    "uvicorn>=0.52.1",
]

[project.optional-dependencies]
cpu = ["torch>=2.7,<3", "torchvision>=0.28,<0.29"]
cuda = ["torch>=2.7,<3", "torchvision>=0.28,<0.29"]

[tool.uv]
conflicts = [[{ extra = "cpu" }, { extra = "cuda" }]]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu130", extra = "cuda" },
]
torchvision = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu130", extra = "cuda" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[project.scripts]
visual-memory-lab = "visual_memory_lab.cli:main"

[dependency-groups]
dev = [
    "httpx2>=2.10.0",
    "pytest>=8,<10",
]

[build-system]
requires = ["uv_build>=0.10.10,<0.11"]
build-backend = "uv_build"
